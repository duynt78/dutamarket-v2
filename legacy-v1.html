<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUTAMARKET AI Studio</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e9edff;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{padding:18px 22px;border-bottom:1px solid #303a56;display:flex;justify-content:space-between;align-items:center;background:#121a30}h1{font-size:21px;margin:0;color:#91f2cf}small,.muted{color:#a9b4cc}button,input,textarea,select{font:inherit;border-radius:10px;border:1px solid #394764;padding:11px;background:#18233d;color:white}button{cursor:pointer;background:#6558ec;border:0}button.secondary{background:#263553}main{display:grid;grid-template-columns:220px 1fr;min-height:90vh}nav{padding:15px;background:#11182b}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;background:transparent}nav button.active{background:#303d68}section{padding:22px;max-width:1150px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#17223a;border:1px solid #303e5c;border-radius:16px;padding:17px;margin-bottom:15px}.card h3{margin-top:0}label{display:block;margin:10px 0 5px}input,textarea,select{width:100%}textarea{min-height:95px}h2{margin-top:0}.hidden{display:none}.pill{display:inline-block;border:1px solid #526384;padding:5px 9px;border-radius:20px;font-size:12px;margin:3px}.output{white-space:pre-wrap;line-height:1.55;background:#0c1426;padding:15px;border-radius:12px;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stat{font-size:26px;font-weight:800;color:#90f4d1}.preview{max-width:100%;border-radius:12px;margin-top:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}#toast{position:fixed;bottom:15px;right:15px;background:#264f46;padding:12px;border-radius:9px;display:none}@media(max-width:700px){main{display:block}nav{display:flex;overflow-x:auto;gap:4px;padding:8px}nav button{min-width:125px;font-size:12px}section{padding:14px}header{padding:12px}}</style></head><body><header><div><h1>✦ DUTAMARKET AI</h1><small>Marketing Studio · Bản demo độc lập</small></div><span class="pill">VI · Browser</span></header><main><nav id="nav"></nav><section id="view"></section></main><div id="toast"></div><script>
const tabs=['Tổng quan','Ask Duta AI','10 công thức','Model Studio','Lịch nội dung','Thư viện','Thương hiệu','Sản phẩm','Quảng cáo','Phân tích','Cài đặt'];const recipes=['Thông báo khuyến mãi','7 bài đăng trong tuần','Bộ nhận diện thương hiệu','Video UGC testimonial','Carousel 5 trang','Sản phẩm trong 6 bối cảnh','Sản phẩm trên người mẫu','Video giải thích ngắn','Trước và sau','Nhân bản 4 mẫu quảng cáo'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('duta_'+k))??d}catch{return d}};const save=(k,v)=>localStorage.setItem('duta_'+k,JSON.stringify(v));let page=0;function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2300)}function btn(t,fn,cl=''){return `<button class="${cl}" onclick="${fn}">${t}</button>`}function nav(){ $('#nav').innerHTML=tabs.map((t,i)=>`<button class="${i===page?'active':''}" onclick="show(${i})">${t}</button>`).join('') }function show(i){page=i;nav();let v=$('#view');v.innerHTML=[home,ask,recipe,studio,calendar,library,brand,products,ads,analytics,settings][i]();}function home(){let a=load('items',[]),p=load('posts',[]);return `<h2>Xin chào, chào mừng đến DUTAMARKET</h2><p class="muted">Quản lý ý tưởng, sáng tạo nội dung và chiến dịch marketing trong một nơi.</p><div class="grid"><div class="card">Nội dung đã lưu<div class="stat">${a.length}</div></div><div class="card">Bài đã lên lịch<div class="stat">${p.length}</div></div><div class="card">Bài đã duyệt<div class="stat">${p.filter(x=>x.status==='Đã duyệt').length}</div></div></div><div class="card"><h3>Bắt đầu nhanh</h3><div class="actions">${btn('Trò chuyện với Duta','show(1)')}${btn('Tạo công thức','show(2)')}${btn('Lên lịch bài đăng','show(4)')}</div></div><p class="muted">Số liệu trên là dữ liệu demo lưu trên thiết bị, không phải số liệu từ mạng xã hội.</p>`}function ask(){return `<h2>Ask Duta AI</h2><div class="card"><label>Yêu cầu marketing</label><textarea id="prompt" placeholder="Ví dụ: Viết bài quảng cáo cà phê giảm giá 20% cuối tuần"></textarea><div class="actions">${btn('Tạo bản nháp','generateText()')}${btn('Tạo kế hoạch 7 ngày','week()','secondary')}</div><div id="result"></div></div><p class="muted">Chế độ mặc định dùng bộ tạo nội dung mẫu tại trình duyệt, không phải mô hình AI trực tuyến.</p>`}function makeCopy(q){let b=load('brand',{});let name=b.name||'DUTAMARKET';return `✨ ${name} | ${q}\n\nKhám phá ưu điểm nổi bật và lựa chọn phù hợp với nhu cầu của bạn.\n\n🎯 Điểm nhấn: ${q}\n📩 Nhắn tin để được tư vấn và nhận thông tin chi tiết.\n\n#${name.replace(/\W/g,'')} #Marketing #UuDai #SanPham` }function result(s){$('#result').innerHTML=`<div class="output">${esc(s)}</div><div class="actions">${btn('Lưu vào thư viện','storeResult()')}${btn('Sao chép','copyResult()','secondary')}${btn('Đưa vào lịch','scheduleResult()','secondary')}</div>`;window.currentText=s}function generateText(){let q=$('#prompt').value.trim();if(!q)return toast('Nhập yêu cầu trước');result(makeCopy(q))}function week(){let q=$('#prompt').value.trim()||'giới thiệu sản phẩm';result(Array.from({length:7},(_,i)=>`Ngày ${i+1}: ${['Giới thiệu','Lợi ích','Hướng dẫn','Câu chuyện thương hiệu','Hỏi đáp','Phản hồi khách hàng','Ưu đãi'][i]} — ${q}\n${makeCopy(q).split('\n')[2]}`).join('\n\n'))}function storeResult(){if(!window.currentText)return;let a=load('items',[]);a.unshift({id:Date.now(),text:window.currentText,date:new Date().toLocaleString('vi-VN')});save('items',a);toast('Đã lưu')}function copyResult(){navigator.clipboard?.writeText(window.currentText||'').then(()=>toast('Đã sao chép')).catch(()=>toast('Không thể sao chép'))}function scheduleResult(){if(!window.currentText)return;let a=load('posts',[]);a.push({text:window.currentText,date:new Date().toISOString().slice(0,10),platform:'Facebook',status:'Chờ duyệt'});save('posts',a);toast('Đã thêm vào lịch')}function recipe(){return `<h2>10 công thức sáng tạo</h2><div class="grid">${recipes.map((r,i)=>`<div class="card"><h3>${i+1}. ${r}</h3><p class="muted">Tạo kịch bản và nội dung theo mục tiêu marketing.</p>${btn('Sử dụng',`useRecipe(${i})`)}</div>`).join('')}</div>`}function useRecipe(i){show(1);$('#prompt').value=`${recipes[i]} cho sản phẩm của tôi`;generateText()}function studio(){return `<h2>Model Studio</h2><div class="card"><label>Chọn loại nội dung</label><select id="model"><option>Hình ảnh quảng cáo</option><option>Video ngắn</option><option>Ảnh sản phẩm</option><option>Carousel</option></select><label>Mô tả chi tiết</label><textarea id="visualPrompt" placeholder="Mô tả sản phẩm, bối cảnh, ánh sáng, phong cách..."></textarea><label>Tỷ lệ</label><select id="ratio"><option>1:1</option><option>9:16</option><option>16:9</option></select><div class="actions">${btn('Tạo brief sáng tạo','createBrief()')}${btn('Thiết kế poster demo','poster()','secondary')}</div><div id="result"></div><canvas id="posterCanvas" class="preview hidden" width="800" height="800" style="width:100%;max-width:480px"></canvas><div id="posterDownload"></div></div><p class="muted">Tạo hình ảnh/video bằng AI thật cần kết nối dịch vụ mô hình qua backend. Poster demo dùng Canvas, không phải ảnh AI.</p>`}function createBrief(){let q=$('#visualPrompt').value.trim();if(!q)return toast('Nhập mô tả');result(`BRIEF ${$('#model').value.toUpperCase()}\nÝ tưởng: ${q}\nTỷ lệ: ${$('#ratio').value}\nPhong cách: hiện đại, ánh sáng chuyên nghiệp, màu sắc nhất quán thương hiệu.\nCTA: Khám phá ngay.\nKịch bản: Mở đầu thu hút → giới thiệu giá trị → lời kêu gọi hành động.`)}function poster(){let q=$('#visualPrompt').value.trim()||'Sản phẩm nổi bật';let c=$('#posterCanvas'),ctx=c.getContext('2d'),b=load('brand',{});let g=ctx.createLinearGradient(0,0,800,800);g.addColorStop(0,b.color||'#5c55d9');g.addColorStop(1,'#11172c');ctx.fillStyle=g;ctx.fillRect(0,0,800,800);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 45px system-ui';ctx.fillText((b.name||'DUTAMARKET').slice(0,22),400,130);ctx.font='bold 42px system-ui';let words=q.split(' '),lines=[],line='';for(let w of words){if((line+' '+w).length>25){lines.push(line);line=w}else line+=(line?' ':'')+w}lines.push(line);lines.slice(0,6).forEach((s,i)=>ctx.fillText(s,400,330+i*58));ctx.fillStyle='#8ef2cf';ctx.fillRect(235,650,330,75);ctx.fillStyle='#14203a';ctx.font='bold 27px system-ui';ctx.fillText('KHÁM PHÁ NGAY',400,697);c.classList.remove('hidden');$('#posterDownload').innerHTML='<div class="actions"><button onclick="downloadPoster()">Tải PNG</button></div>'}function downloadPoster(){let a=document.createElement('a');a.href=$('#posterCanvas').toDataURL('image/png');a.download='dutamarket-poster.png';a.click()}function calendar(){let a=load('posts',[]);return `<h2>Lịch nội dung</h2><div class="card"><label>Nội dung bài đăng</label><textarea id="postText"></textarea><div class="row"><div><label>Ngày</label><input type="date" id="postDate" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Nền tảng</label><select id="platform"><option>Facebook</option><option>Instagram</option><option>TikTok</option></select></div></div><div class="actions">${btn('Thêm bài chờ duyệt','addPost()')}</div></div>${a.map((p,i)=>`<div class="card"><span class="pill">${esc(p.platform)}</span><span class="pill">${esc(p.status)}</span><span class="pill">${esc(p.date)}</span><p>${esc(p.text).slice(0,450)}</p><div class="actions">${btn('Duyệt',`approve(${i})`)}${btn('Xóa',`removePost(${i})`,'secondary')}</div></div>`).join('')||'<p class="muted">Chưa có bài nào.</p>'}<p class="muted">Lịch và phê duyệt hoạt động nội bộ. Chưa tự đăng lên tài khoản mạng xã hội.</p>`}function addPost(){let t=$('#postText').value.trim();if(!t)return toast('Nhập nội dung');let a=load('posts',[]);a.push({text:t,date:$('#postDate').value,platform:$('#platform').value,status:'Chờ duyệt'});save('posts',a);show(4)}function approve(i){let a=load('posts',[]);a[i].status='Đã duyệt';save('posts',a);show(4)}function removePost(i){let a=load('posts',[]);a.splice(i,1);save('posts',a);show(4)}function library(){let a=load('items',[]);return `<h2>Thư viện nội dung</h2>${a.map((x,i)=>`<div class="card"><small>${esc(x.date)}</small><div class="output">${esc(x.text)}</div><div class="actions">${btn('Xóa',`removeItem(${i})`,'secondary')}</div></div>`).join('')||'<p>Chưa có nội dung.</p>'}`}function removeItem(i){let a=load('items',[]);a.splice(i,1);save('items',a);show(5)}function brand(){let b=load('brand',{});return `<h2>Thương hiệu</h2><div class="card"><label>Tên thương hiệu</label><input id="brandName" value="${esc(b.name||'')}"><label>Website</label><input id="brandSite" value="${esc(b.site||'')}"><label>Ngành hàng</label><input id="brandSector" value="${esc(b.sector||'')}"><label>Giọng văn</label><select id="brandVoice"><option ${b.voice==='Thân thiện'?'selected':''}>Thân thiện</option><option ${b.voice==='Chuyên nghiệp'?'selected':''}>Chuyên nghiệp</option><option ${b.voice==='Trẻ trung'?'selected':''}>Trẻ trung</option></select><label>Màu chủ đạo</label><input type="color" id="brandColor" value="${esc(b.color||'#6558ec')}"><div class="actions">${btn('Lưu thương hiệu','saveBrand()')}</div></div>`}function saveBrand(){save('brand',{name:$('#brandName').value,site:$('#brandSite').value,sector:$('#brandSector').value,voice:$('#brandVoice').value,color:$('#brandColor').value});toast('Đã lưu thương hiệu')}function products(){let a=load('products',[]);return `<h2>Danh mục sản phẩm</h2><div class="card"><label>Tên sản phẩm</label><input id="productName"><label>Mô tả</label><textarea id="productDesc"></textarea><label>Giá tham khảo</label><input id="productPrice"><div class="actions">${btn('Thêm sản phẩm','addProduct()')}</div></div><div class="grid">${a.map((p,i)=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><p>${esc(p.price)}</p>${btn('Tạo bài quảng cáo',`promote(${i})`)} ${btn('Xóa',`deleteProduct(${i})`,'secondary')}</div>`).join('')}</div>`}function addProduct(){let a=load('products',[]);if(!$('#productName').value.trim())return toast('Nhập tên');a.push({name:$('#productName').value,desc:$('#productDesc').value,price:$('#productPrice').value});save('products',a);show(7)}function deleteProduct(i){let a=load('products',[]);a.splice(i,1);save('products',a);show(7)}function promote(i){let a=load('products',[]);show(1);$('#prompt').value=`Quảng bá ${a[i].name}: ${a[i].desc}, giá ${a[i].price}`;generateText()}function ads(){return `<h2>Thư viện quảng cáo</h2><p class="muted">Mẫu sáng tạo độc lập, không lấy quảng cáo hoặc dữ liệu riêng của Clicky Vicky.</p><div class="grid">${['Ưu đãi giới hạn','Ra mắt sản phẩm','Khách hàng đánh giá','Giải pháp vấn đề','Mẹo sử dụng','Khuyến mãi theo mùa'].map((x,i)=>`<div class="card"><h3>${x}</h3><p>Hook → lợi ích → CTA</p>${btn('Tạo nội dung',`adToAsk(${i})`)}</div>`).join('')}</div>`}function adToAsk(i){let arr=['Ưu đãi giới hạn','Ra mắt sản phẩm','Khách hàng đánh giá','Giải pháp vấn đề','Mẹo sử dụng','Khuyến mãi theo mùa'];show(1);$('#prompt').value=`Viết quảng cáo theo mẫu ${arr[i]}`;generateText()}function analytics(){let a=load('posts',[]);return `<h2>Phân tích chiến dịch</h2><div class="grid"><div class="card">Tổng bài đã lên lịch<div class="stat">${a.length}</div></div><div class="card">Đã duyệt<div class="stat">${a.filter(x=>x.status==='Đã duyệt').length}</div></div><div class="card">Chờ duyệt<div class="stat">${a.filter(x=>x.status==='Chờ duyệt').length}</div></div></div><div class="card"><h3>Thống kê theo nền tảng</h3>${['Facebook','Instagram','TikTok'].map(p=>`<p>${p}: ${a.filter(x=>x.platform===p).length} bài</p>`).join('')}</div><p class="muted">Không có dữ liệu reach, doanh thu hay người theo dõi thật cho đến khi kết nối API chính thức.</p>`}function settings(){return `<h2>Cài đặt</h2><div class="card"><h3>Dữ liệu cục bộ</h3><p>Dữ liệu được lưu bằng localStorage trên trình duyệt này. Không đồng bộ giữa các thiết bị.</p><div class="actions">${btn('Xuất dữ liệu JSON','exportData()')}${btn('Xóa dữ liệu demo','clearData()','secondary')}</div><label>Nhập dữ liệu JSON đã sao lưu</label><input type="file" id="importFile" accept="application/json"><div class="actions">${btn('Khôi phục','importData()')}</div></div><div class="card"><h3>Tích hợp sản xuất (chưa kết nối)</h3><p>Cloudflare Workers + D1/R2 · API AI ảnh/video · Meta Graph API · TikTok Content Posting API · OAuth · Cron · Analytics.</p><p class="muted">Không nhập API key bí mật vào file HTML công khai.</p></div>`}function exportData(){let o={};['items','posts','brand','products'].forEach(k=>o[k]=load(k,k==='brand'?{}:[]));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='dutamarket-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function clearData(){if(confirm('Xóa toàn bộ dữ liệu DUTAMARKET trên trình duyệt này?')){['items','posts','brand','products'].forEach(k=>localStorage.removeItem('duta_'+k));show(10)}}function importData(){let f=$('#importFile').files[0];if(!f)return toast('Chọn file JSON');let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!o||!Array.isArray(o.items)||!Array.isArray(o.posts)||!Array.isArray(o.products)||typeof o.brand!=='object'||Array.isArray(o.brand))throw Error();['items','posts','brand','products'].forEach(k=>save(k,o[k]));toast('Đã khôi phục');show(10)}catch{toast('File sao lưu không hợp lệ')}};r.readAsText(f)}show(0);
</script></body></html>
